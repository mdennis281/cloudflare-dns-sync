# setup.sh / setup.ps1 copy this to config.ini and fill in siteName for you.
# Copy it by hand if you're setting up manually.
#
# Your API token does NOT go in here -- it lives in the .env file next to
# this one. See .env.example.

[CloudFlare-API]
# Default zone for every record below. Records may override it with "zone".
siteName = mydomain.com

# --- One [DNS:<record name>] section per record -----------------------------
# Values not set here fall back to the [DNS] defaults section below.

[DNS:home.mydomain.com]
recordType = A

[DNS:vpn.mydomain.com]
recordType = A
proxied = False

# A record living in a different zone on the same account:
# [DNS:nas.otherdomain.com]
# zone = otherdomain.com

# An IPv6 record — the public IPv6 address is looked up separately:
# [DNS:home.mydomain.com]
# recordType = AAAA

# --- Wildcards ---------------------------------------------------------------
# A name containing "*" is a pattern, not a hostname. Every existing record of
# the same type whose name matches gets pointed at your public IP, so you can
# cover a whole subtree without listing each host:
#
# [DNS:*.test.mydomain.com]
#     matches test.mydomain.com's children — app.test.mydomain.com,
#     api.test.mydomain.com, one.two.test.mydomain.com — and the Cloudflare
#     wildcard record "*.test.mydomain.com" itself, if you have one.
#
# "*" may also sit inside a label, e.g. [DNS:dev-*.mydomain.com].
#
# Two things to know:
#   * Matched records keep their own proxied and ttl settings; only the IP is
#     touched. Those keys apply just to a record this tool creates itself.
#   * createRecord only has something to create when the pattern is a real
#     Cloudflare wildcard ("*." as the leftmost label) and nothing matched.
#     Otherwise a pattern that matches nothing is simply a no-op.
#
# Careful: a wildcard claims every matching A/AAAA record in the zone,
# including ones deliberately pointed somewhere else.
# [DNS:*.test.mydomain.com]
# recordType = A

# --- Defaults inherited by every [DNS:...] section above ---------------------
[DNS]
recordType = A
proxied = False
createRecord = True
# 1 = automatic. Ignored (forced to 1) when proxied = True.
ttl = 1

[general]
loggingEnabled = True
# Relative paths resolve against this config file's directory.
logPath = CF-DNS.log
# 1 = errors only, 2 = info, 3 = debug
logLevel = 2

# --- Log rotation -----------------------------------------------------------
# size  = roll at logMaxSize into CF-DNS.log.1 ... .5   (default)
# daily = roll at midnight into CF-DNS.log.2026-08-21
# off   = never roll; the file grows forever
logRotation = size
# Only used by logRotation = size. Bytes, or a suffix: 512KB, 5MB, 1GB.
logMaxSize = 1MB
# How many old logs to keep. 0 discards the old log instead of keeping it.
logBackups = 5
