# setup.sh / setup.ps1 copy this to config.ini and fill in siteName for you.
# Copy it by hand if you're setting up manually.
#
# Your API token does NOT go in here -- it lives in the .env file next to
# this one. See .env.example.

[CloudFlare-API]
# Default zone for every record below. Records may override it with "zone".
siteName = mydomain.com

# --- One [DNS:<record name>] section per record -----------------------------
# Values not set here fall back to the [DNS] defaults section below.

[DNS:home.mydomain.com]
recordType = A

[DNS:vpn.mydomain.com]
recordType = A
proxied = False

# A record living in a different zone on the same account:
# [DNS:nas.otherdomain.com]
# zone = otherdomain.com

# An IPv6 record — the public IPv6 address is looked up separately:
# [DNS:home.mydomain.com]
# recordType = AAAA

# --- Defaults inherited by every [DNS:...] section above ---------------------
[DNS]
recordType = A
proxied = False
createRecord = True
# 1 = automatic. Ignored (forced to 1) when proxied = True.
ttl = 1

[general]
loggingEnabled = True
# Relative paths resolve against this config file's directory.
logPath = CF-DNS.log
# 1 = errors only, 2 = info, 3 = debug
logLevel = 2
